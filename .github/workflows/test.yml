name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "POSTGRES_DB_AUTH=auth_db" >> .env
          echo "POSTGRES_DB_UNIVERSITY=university_db" >> .env
          echo "UNIVERSITY_SERVICE_INTERNAL_URL=http://university:8000" >> .env
          echo "UNIVERSITY_SERVICE_API_URL=http://university:8000" >> .env
          echo "AUTH_SERVICE_INTERNAL_URL=http://auth:8000" >> .env
          echo "AUTH_SERVICE_API_URL=http://auth:8000" >> .env

      - name: Build tests image
        run: |
          docker build -t my-tests .

      - name: Start test system
        run: |
          docker compose up -d

      - name: Run tests
        run: |
          docker run \
            --network backend-tests_default \
            -e AUTH_SERVICE_API_URL=http://auth:8000 \
            -e UNIVERSITY_SERVICE_API_URL=http://university:8000 \
            my-tests

      - name: Stop containers
        if: always()
        run: |
          docker compose down -v

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/