name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ДЖОБА 1: Линтер
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build tests image
        run: |
          docker build -t my-tests .

      - name: Run Ruff linter
        run: |
          docker run --rm -v $(pwd):/app my-tests ruff check /app

  # ДЖОБА 2: Подготовка окружения и тесты
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB_AUTH=${{ secrets.POSTGRES_DB_AUTH }}" >> .env
          echo "POSTGRES_DB_UNIVERSITY=${{ secrets.POSTGRES_DB_UNIVERSITY }}" >> .env
          echo "UNIVERSITY_SERVICE_INTERNAL_URL=http://university:8000" >> .env
          echo "UNIVERSITY_SERVICE_API_URL=http://university:8000" >> .env
          echo "AUTH_SERVICE_INTERNAL_URL=http://auth:8000" >> .env
          echo "AUTH_SERVICE_API_URL=http://auth:8000" >> .env

      - name: Build tests image
        run: |
          docker build -t my-tests .

      - name: Start test system
        run: |
          docker compose up -d

      - name: Check services status
        run: |
          docker compose ps
          echo "Waiting for services to be ready..."
          sleep 10
          echo "Checking auth service..."
          curl -v http://localhost:8000/docs || echo "Auth not responding"
          echo "Checking university service..."
          curl -v http://localhost:8001/docs || echo "University not responding"

      - name: Run tests
        run: |
          docker run \
            --network backend-tests_default \
            -v $(pwd)/allure-results:/app/allure-results \
            -v $(pwd)/allure-report:/app/allure-report \
            -e AUTH_SERVICE_API_URL=http://auth:8000 \
            -e UNIVERSITY_SERVICE_API_URL=http://university:8000 \
            my-tests

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

  # ДЖОБА 3: Деплой
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Generate Allure report (if results exist)
        if: always()
        run: |
          mkdir -p allure-report
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            docker run --rm \
              -v $(pwd)/allure-results:/app/allure-results \
              -v $(pwd)/allure-report:/app/allure-report \
              my-tests \
              sh -c "allure generate /app/allure-results -o /app/allure-report --clean"
          else
            echo "No allure-results found, skipping report generation"
            echo "<html><body><h1>No test results available</h1></body></html>" > allure-report/index.html
          fi

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages